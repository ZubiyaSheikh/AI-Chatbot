{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

</head>

<body>

    <div class="auth-wrapper">

    <div class="blur blur-1"></div>
    <div class="blur blur-2"></div>

    <div class="auth-card">
        <div class="auth-content">
        <div class="logo">
    <img src="{% static 'accounts/images/logo.png' %}" alt="AI Chatbot Logo">
</div>

<h1>Welcome Back</h1>

<p class="subtitle">
    Login to your account
</p>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
            >

            <button type="submit">
                Login
            </button>

        </form>
        </div>
        <p>
            Don't have an account?
            <a href="/register/">Register</a>
        </p>

    </div>

    {% if messages %}
    <script>
        {% for message in messages %}
        
        
    Swal.fire({
    icon: "{{ message.tags }}",
    title: "{{ message }}",
    toast: true,
    position: "top-end",
    showConfirmButton: false,
    timer: 2500,
    timerProgressBar: true,
    background: "#111827",
    color: "#ffffff",
    width: "380px",
    padding: "1rem",
    showClass: {
        popup: "animate__animated animate__fadeInRight"
    },
    hideClass: {
        popup: "animate__animated animate__fadeOutRight"
    }
});

        {% endfor %}
    </script>
    {% endif %}

</body>

</html>
